<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Byte-for-byte the string from Tiltboard, which sits correctly on the same
      phone this app did not. Do not "tidy" it.

      `viewport-fit=cover` is the switch that decides whether iOS hands the page
      the whole screen or insets the viewport to the safe area. Inset, the app
      is letterboxed: a band of background above and below it that the page
      cannot paint into because it does not own those pixels, and every
      env(safe-area-inset-*) reads 0 so nothing in the CSS can even detect it.
      That is the failure this exact string fixes.

      Written on one line, no spaces, cover last, because that is the form known
      to work here — reordering it or breaking it across lines for readability
      is exactly the kind of harmless-looking edit that brings the bands back.
    -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <!--
      Two tags, not one, and both carry a `media`.

      This is the colour a browser paints the surrounding UI with — a tab's
      toolbar, a desktop install's title bar, the status bar on iOS — and a
      single unconditional #1c1c1e is why those came out dark above a white app.

      One correction to what this comment used to claim, because a device
      disproved it: an *installed* PWA on Android does not read these tags at
      all. Chrome bakes the manifest's theme_color into the WebAPK at install
      and paints the status bar from that, ignoring the page. The manifest
      therefore drops theme_color entirely (see vite.config.ts, which explains
      why) — these tags stay because every other surface does honour them, and
      Android will too once installed PWAs can draw behind the status bar.

      Chrome takes the FIRST tag whose media matches, so ordering them
      light-then-dark is not cosmetic. Keep both values equal to --bg in
      app.css for the corresponding scheme; App.tsx overwrites the content of
      every one of these from the resolved root background as soon as it
      mounts, so these two only have to be right for the moments before that,
      and for the case JS never gets there at all.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta name="description" content="Local-first markdown notes that sync everywhere." />
    <!-- The standard tag; Chrome deprecated the apple-prefixed one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Still required: iOS Safari reads only the prefixed form, and without it
         an installed PWA opens inside Safari chrome instead of standalone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default`, not `black-translucent`.

      black-translucent is the tempting one: it promises an edge-to-edge web
      view with the app painting under the status bar. What it delivers on an
      installed iOS PWA is a view that does not reach the bottom of the screen —
      a band of dead space below the app that no CSS inside the page can fill,
      because the page was never given that space to paint into. It also drags
      in a set of long-standing standalone-mode layout quirks around how the
      viewport and the safe-area insets relate.

      With `default`, iOS insets the web view itself for the status bar,
      safe-area-inset-top reports 0 in standalone, and the view extends to the
      bottom edge like every other app on the phone. The layout needs no
      compensation for it: the insets are read through env() in shell.css, so
      they simply resolve to 0 at the top and the home-indicator height at the
      bottom, and the shell is correct without being told anything.

      Only use black-translucent if you actually want content painted under the
      status bar — edge-to-edge hero imagery. A bottom bar is not a reason to.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Slate" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Slate</title>
    <style>
      /*
        Paint the shell colour before the CSS bundle lands, so a cold start on
        a slow connection doesn't flash white in dark mode.

        Both halves are needed, and the [data-theme] rules have to come last.
        `prefers-color-scheme` only knows what the *phone* is set to; the in-app
        theme override is stamped onto <html> as data-theme, and when the two
        disagree — phone in light mode, app set to Dark — a media-query-only
        rule leaves the root element white underneath a dark app.

        On Android that is not a flash, it is permanent: Chrome colours the
        system navigation bar from the *root* element's background, not the
        body's, so a white <html> paints a white band across the bottom of the
        screen for as long as the PWA is open. app.css carries the durable
        version of this rule (html { background: var(--bg) }) once the bundle
        has landed; this block only has to survive the moments before it does.
      */
      html {
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #1c1c1e;
        }
      }
      html[data-theme='light'] {
        background: #fff;
      }
      html[data-theme='dark'] {
        background: #1c1c1e;
      }
    </style>
